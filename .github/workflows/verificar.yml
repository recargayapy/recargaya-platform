name: Verificar

# Los oraculos del proyecto, corriendo solos en cada cambio.
# Un oraculo determinista es mejor supervisor que cualquier modelo: no se
# cansa y no opina.
#
# Se llama a `npm run verificar` y NO a cada oraculo por separado, a proposito:
# asi el CI y la maquina de cualquiera corren exactamente lo mismo. Cuando se
# agregue un oraculo nuevo, el CI lo ejecuta sin que nadie se acuerde de tocar
# este archivo. Esa divergencia ya nos costo una entrega: check-esquema.mjs
# existia en el repo y el CI no lo corria.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # `npm ci` y no `npm install`, por la misma razon que en
      # desplegar-staging.yml: si el oraculo instalara dependencias distintas a
      # las del despliegue, verificaria un arbol que nunca sale al aire.
      - run: npm ci

      # entorno + tipos + pruebas + esquema + runtime + mutacion. `runtime` levanta
      # workerd de verdad para las pruebas del Durable Object.
      - name: Verificar
        run: npm run verificar

      # El secreto que nunca tiene que estar. Se busca a proposito porque
      # esto no falla ruidosamente solo.
      - name: Ningun secreto en el arbol
        run: |
          if git ls-files | grep -E '(^|/)\.dev\.vars$|\.env$'; then
            echo "::error::hay un archivo de secretos versionado"
            exit 1
          fi
          echo "sin secretos versionados"
